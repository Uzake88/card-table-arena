services:
  web:
    build: .
    command: npm run start
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_REALTIME_URL: ws://localhost:8787
  realtime:
    build: .
    command: npm run realtime
    ports:
      - "8787:8787"
    environment:
      NODE_ENV: production
      PORT: 8787
    restart: unless-stopped
